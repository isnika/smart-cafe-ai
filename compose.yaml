name: smart-cafe

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_cafe}
      MYSQL_USER: ${MYSQL_USER:-smart_cafe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Dien MYSQL_PASSWORD trong .env root}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Dien MYSQL_ROOT_PASSWORD trong .env root}

    ports:
      - "${MYSQL_PORT:-3306}:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    env_file:
      - ./backend/.env

    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/${MYSQL_DATABASE:-smart_cafe}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-smart_cafe}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Dien MYSQL_PASSWORD trong .env root}

      # Đổi tên biến theo cấu hình thực tế của backend.
      AI_SERVICE_URL: http://ai-service:8000

    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_started

    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    ports:
      - "${AI_PORT:-8000}:8000"

    env_file:
      - ./ai-service/.env

    environment:
      # Ollama chạy trên máy Windows.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      HF_HOME: /app/.cache/huggingface

    volumes:
      - huggingface-cache:/app/.cache/huggingface

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "${FRONTEND_PORT:-5173}:80"

    env_file:
      - ./frontend/.env

    environment:
      # Trình duyệt gọi backend qua cổng public trên máy.
      # Đổi tên biến theo tên frontend đang sử dụng.
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}

    depends_on:
      backend:
        condition: service_started

    restart: unless-stopped

volumes:
  mysql-data:
  huggingface-cache:
