services:
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile

    ports:
      - "${AI_PORT:-8000}:8000"

    env_file:
      - ./ai-service/.env

    environment:
      # Ollama đang chạy trên máy Windows
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      HF_HOME: /app/.cache/huggingface

    volumes:
      - huggingface-cache:/app/.cache/huggingface

    restart: unless-stopped

  # service BE và FE tại đây,
  # cùng cấp ai-service.

volumes:
  huggingface-cache: