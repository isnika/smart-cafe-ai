server:
  port: 8088

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

spring:
  application:
    name: intelligence-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_cafe_intelligence_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# AI Service Configuration
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    reindex-key: ${CHAT_REINDEX_API_KEY:smart-cafe-reindex-secret}
    # Áp dụng cho cả kết nối và đọc response từ ai-service.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
  internal:
    api-key: ${DATA_API_KEY:smart-cafe-internal-ai-key}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Internal backend dependencies for Snapshot & Lookup
services:
  internal:
    key: ${INTERNAL_API_KEY:smart-cafe-internal-key}
    catalog-url: ${CATALOG_INTERNAL_BASE_URL:http://localhost:8082}
    order-url: ${ORDER_INTERNAL_BASE_URL:http://localhost:8084}
    store-url: ${STORE_INTERNAL_BASE_URL:http://localhost:8083}
    inventory-url: ${INVENTORY_INTERNAL_BASE_URL:http://localhost:8086}

