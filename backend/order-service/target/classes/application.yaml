server:
  port: 8084

spring:
  application:
    name: order-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smartcafe}
    password: ${RABBITMQ_PASSWORD:smartcafe-local}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          max-attempts: 3
          multiplier: 2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_cafe_order_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          java_time_use_direct_jdbc: true
        jdbc:
          time_zone: UTC

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app:
  internal-api-key: ${ORDER_INTERNAL_API_KEY:}
  store:
    internal-base-url: ${STORE_INTERNAL_BASE_URL:}
    auth-header: ${STORE_INTERNAL_AUTH_HEADER:X-Service-Key}
    auth-value: ${STORE_INTERNAL_AUTH_VALUE:}
  catalog:
    internal-base-url: ${CATALOG_INTERNAL_BASE_URL:http://localhost:8082/internal/catalog}
    auth-header: X-Service-Key
    auth-value: ${CATALOG_INTERNAL_API_KEY:}
  identity:
    internal-base-url: ${IDENTITY_INTERNAL_BASE_URL:http://localhost:8081/api/v1/internal}
    auth-header: X-Service-Key
    auth-value: ${IDENTITY_INTERNAL_API_KEY:}
  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    vat-rate: ${ORDER_VAT_RATE:0}
    expiry-enabled: ${ORDER_EXPIRY_ENABLED:true}
    expiry-delay-ms: 30000
  order-events:
    publisher-enabled: ${ORDER_EVENTS_PUBLISHER_ENABLED:true}
    consumer-enabled: ${ORDER_EVENTS_CONSUMER_ENABLED:false}
    publish-delay-ms: 1000
