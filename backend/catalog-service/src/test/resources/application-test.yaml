debug: false
app:
  internal-api-key: catalog-test-internal-key
  catalog-events:
    publisher-enabled: false
    inventory-consumer-enabled: false
logging:
  level:
    root: WARN

spring:
  datasource:
    url: jdbc:h2:mem:catalog_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

