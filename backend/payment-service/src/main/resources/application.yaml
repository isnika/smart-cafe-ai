server:
  port: 8085

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

spring:
  application:
    name: payment-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_cafe_payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Security JWT
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours

# Payment Gateways Configuration (Sandbox Default)
payment:
  vnpay:
    url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:LWBBGBH4}
    hash-secret: ${VNPAY_HASH_SECRET:YILRBVCGESHZNWWBIQJZUMVQASWQSKMO}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}
    version: "2.1.0"
    command: "pay"
    currency: "VND"
    locale: "vn"
  momo:
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:MOMOBKUN20180529}
    access-key: ${MOMO_ACCESS_KEY:klm05TvNBzhg7h7j}
    secret-key: ${MOMO_SECRET_KEY:at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
    return-url: ${MOMO_RETURN_URL:http://localhost:3000/payment/momo-return}
    notify-url: ${MOMO_NOTIFY_URL:http://localhost:8085/payments/momo/ipn}

# RabbitMQ Exchange & Queues
rabbitmq:
  exchange:
    payment: smartcafe.payment.exchange
  routing-key:
    payment-succeeded: payment.succeeded
    payment-failed: payment.failed
    refund-processed: refund.processed
