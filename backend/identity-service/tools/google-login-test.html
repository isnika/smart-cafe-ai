<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>SmartCoffee — Lấy Google ID token</title>
  <style>
    body { max-width: 850px; margin: 40px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; color: #253528; }
    h1 { line-height: 1.3; }
    label { display: block; font-weight: 600; margin-top: 20px; }
    input, textarea { box-sizing: border-box; width: 100%; margin: 8px 0; padding: 12px; border: 1px solid #aab5aa; border-radius: 6px; }
    textarea { min-height: 200px; }
    button { padding: 10px 16px; margin: 8px 0 20px; cursor: pointer; }
    #status { min-height: 26px; }
  </style>
</head>
<body>
  <h1>Lấy Google ID token để test Postman</h1>
  <p>Dán Client ID giống Client ID đã cấu hình cho identity-service.</p>
  <form id="setup">
    <label for="client-id">1. Google Client ID</label>
    <input id="client-id" required placeholder="123456789-xxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
    <button type="submit">2. Hiện nút đăng nhập Google</button>
  </form>
  <div id="google-button"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <label for="token">3. Google ID token — copy vào trường id_token trong Postman</label>
  <textarea id="token" readonly spellcheck="false"></textarea>
  <p>Token chỉ được hiển thị trong tab này. Trang không gửi token tới backend và không lưu token vào trình duyệt.</p>
  <script>
    const status = document.getElementById("status");
    const token = document.getElementById("token");
    document.getElementById("setup").addEventListener("submit", event => {
      event.preventDefault();
      const clientId = document.getElementById("client-id").value.trim();
      if (!/^[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$/.test(clientId)) {
        status.textContent = "Hãy dán toàn bộ Client ID có đuôi .apps.googleusercontent.com.";
        return;
      }
      if (!window.google?.accounts?.id) {
        status.textContent = "Thư viện Google chưa tải xong. Đợi vài giây rồi bấm lại; nếu vẫn lỗi hãy kiểm tra kết nối mạng.";
        return;
      }
      token.value = "";
      google.accounts.id.initialize({
        client_id: clientId,
        auto_select: false,
        callback: response => {
          token.value = response.credential;
          status.textContent = "Đã nhận token. Bấm vào ô token, nhấn Ctrl+A rồi Ctrl+C để copy sang Postman. Giữ kín token này.";
        }
      });
      const target = document.getElementById("google-button");
      target.replaceChildren();
      google.accounts.id.renderButton(target, { theme: "outline", size: "large" });
      status.textContent = "Bấm nút Google bên trên và chọn tài khoản Gmail dùng để test.";
    });
  </script>
  <script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
