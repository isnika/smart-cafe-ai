spring:
  datasource:
    url: jdbc:h2:mem:identity_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

cloudinary:
  cloud-name: test
  api-key: test
  api-secret: test

app:
  otp-email:
    publisher-enabled: false
