spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:engagement_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  mail:
    username: sender@example.com
eureka:
  client:
    enabled: false
app:
  engagement:
    internal-api-key: test-service-key
    consumer-enabled: false
    publisher-enabled: false
  mail:
    from: sender@example.com
  notifications:
    internal-token: test-internal-token
management:
  health:
    mail:
      enabled: false

# Test-only key; production requires JWT_SECRET from the environment.
jwt:
  secret: dGVzdC1vbmx5LWVuZ2FnZW1lbnQtc2lnbmluZy1rZXktMzItYnl0ZXM=

debug: false
logging:
  level:
    root: WARN
    org.hibernate.SQL: WARN
    org.springframework: WARN
    com.smart_cafe_ai: INFO
