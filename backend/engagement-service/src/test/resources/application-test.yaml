spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:engagement_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  mail:
    username: sender@example.com
eureka:
  client:
    enabled: false
app:
  mail:
    from: sender@example.com
  notifications:
    internal-token: test-internal-token
management:
  health:
    mail:
      enabled: false
