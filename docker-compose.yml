    image: smartcafe/payment-service:latest
    container_name: smartcafe-payment-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_cafe_payment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
