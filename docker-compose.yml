      ENGAGEMENT_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_cafe_engagement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      ENGAGEMENT_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      ENGAGEMENT_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
