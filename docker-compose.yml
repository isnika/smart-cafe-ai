services:
  # ============================================================================
  # 1. INFRASTRUCTURE: DATABASE & MESSAGE BROKER
  # ============================================================================

  mysql:
    image: mysql:8.0
    container_name: smartcafe-mysql
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/smart_cafe_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 1024M

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartcafe-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-smartcafe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartcafe-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 512M

  # Optional local SMTP inbox for testing email sending
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: smartcafe-mailpit
    profiles: ["tools", "all"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - smartcafe-network

  # ============================================================================
  # 2. SERVICE DISCOVERY (Eureka Server)
  # ============================================================================

  discovery-server:
    build:
      context: ./backend/discovery-server
      dockerfile: Dockerfile
    image: smartcafe/discovery-server:latest
    container_name: smartcafe-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 384M

  # ============================================================================
  # 3. API GATEWAY (Port 8080)
  # ============================================================================

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    image: smartcafe/api-gateway:latest
    container_name: smartcafe-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 384M

  # ============================================================================
  # 4. BUSINESS MICROSERVICES
  # ============================================================================

  identity-service:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile
    image: smartcafe/identity-service:latest
    container_name: smartcafe-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_cafe_identity_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-smartcafe}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcafe-local}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:-smart-cafe-internal-identity-key}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dri1spe3b}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-798639994742186}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-q7yovPI-IPJgLKEdIFOAVYloSro}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_LOG_CODES: ${OTP_LOG_CODES:-true}
      OTP_EMAIL_PUBLISHER_ENABLED: ${OTP_EMAIL_PUBLISHER_ENABLED:-true}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 512M

  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    image: smartcafe/catalog-service:latest
    container_name: smartcafe-catalog-service
    restart: unless-stopped
    ports:
