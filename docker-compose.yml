      CATALOG_INTERNAL_BASE_URL: ${CATALOG_INTERNAL_BASE_URL:-http://catalog-service:8082/internal/catalog}
      CATALOG_INTERNAL_API_KEY: ${CATALOG_INTERNAL_API_KEY:-smart-cafe-internal-catalog-key}
      IDENTITY_INTERNAL_BASE_URL: ${IDENTITY_INTERNAL_BASE_URL:-http://identity-service:8081/api/v1/internal}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:-smart-cafe-internal-identity-key}
      ENGAGEMENT_INTERNAL_BASE_URL: ${ENGAGEMENT_INTERNAL_BASE_URL:-http://engagement-service:8087/api/v1/internal}
      ENGAGEMENT_INTERNAL_API_KEY: ${ENGAGEMENT_INTERNAL_API_KEY:-smart-cafe-internal-engagement-key}
