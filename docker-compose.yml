  intelligence-service:
    build:
      context: ./backend/intelligence-service
      dockerfile: Dockerfile
    image: smartcafe/intelligence-service:latest
    container_name: smartcafe-intelligence-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_cafe_intelligence_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
