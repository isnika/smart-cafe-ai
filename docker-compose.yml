      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcafe-local}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ENGAGEMENT_INTERNAL_API_KEY: ${ENGAGEMENT_INTERNAL_API_KEY:-smart-cafe-internal-engagement-key}
      NOTIFICATION_INTERNAL_TOKEN: ${NOTIFICATION_INTERNAL_TOKEN:-smart-cafe-notification-internal-token}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
