# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================

volumes:
  mysql_data:
    name: smartcafe_mysql_data
  rabbitmq_data:
    name: smartcafe_rabbitmq_data

networks:
  smartcafe-network:
    name: smartcafe-network
    driver: bridge
