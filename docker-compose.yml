    environment:
      SPRING_JPA_HIBERNATE_NAMING_PHYSICAL_STRATEGY: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_cafe_catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      STORE_INTERNAL_BASE_URL: ${STORE_INTERNAL_BASE_URL:-http://store-service:8083/internal}
      STORE_INTERNAL_API_KEY: ${STORE_INTERNAL_API_KEY:-smart-cafe-internal-store-key}
      CATALOG_INTERNAL_API_KEY: ${CATALOG_INTERNAL_API_KEY:-smart-cafe-internal-catalog-key}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-dri1spe3b}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-798639994742186}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-q7yovPI-IPJgLKEdIFOAVYloSro}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - smartcafe-network
    deploy:
      resources:
        limits:
          memory: 512M

  store-service:
    build:
      context: ./backend/store-service
      dockerfile: Dockerfile
    image: smartcafe/store-service:latest
    container_name: smartcafe-store-service
