      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcafe-local}
      EUREKA_SERVER_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      # VNPay Configuration
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-LWBBGBH4}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-YILRBVCGESHZNWWBIQJZUMVQASWQSKMO}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:3000/payment/vnpay-return}
      # MoMo Configuration
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-MOMOBKUN20180529}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-klm05TvNBzhg7h7j}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-at67qH6mk8w5Y1nAyMoYKMWACiEi2bsa}
      MOMO_RETURN_URL: ${MOMO_RETURN_URL:-http://localhost:3000/payment/momo-return}
      MOMO_NOTIFY_URL: ${MOMO_NOTIFY_URL:-http://localhost:8085/payments/momo/ipn}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - smartcafe-network
    deploy:
