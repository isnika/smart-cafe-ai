services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: smart-cafe-ai

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_RETRY_BASE_SECONDS: ${LLM_RETRY_BASE_SECONDS:-0.4}
      LLM_RETRY_MAX_SECONDS: ${LLM_RETRY_MAX_SECONDS:-4}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_WARMUP: ${LLM_WARMUP:-false}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.68}
      RAG_LEXICAL_WEIGHT: ${RAG_LEXICAL_WEIGHT:-0.30}
      RAG_ALLOW_MODEL_DOWNLOAD: ${RAG_ALLOW_MODEL_DOWNLOAD:-true}
      RAG_DISABLE_EMBEDDINGS: ${RAG_DISABLE_EMBEDDINGS:-false}
      RAG_WARM_EMBEDDING_MODEL: ${RAG_WARM_EMBEDDING_MODEL:-true}
      DATA_API_BASE_URL: ${DATA_API_BASE_URL:-}
      DATA_API_KEY: ${DATA_API_KEY:-}
      DATA_API_TIMEOUT_SECONDS: ${DATA_API_TIMEOUT_SECONDS:-3}
      DATA_API_CATALOG_PATH: ${DATA_API_CATALOG_PATH:-/api/ai/catalog/search}
      DATA_API_ORDER_PATH: ${DATA_API_ORDER_PATH:-/api/ai/orders/:order_code}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CHAT_RATE_LIMIT_ENABLED: ${CHAT_RATE_LIMIT_ENABLED:-true}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-60}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      CHAT_REINDEX_API_KEY: ${CHAT_REINDEX_API_KEY:-}
      CHAT_SOURCE_MODE: ${CHAT_SOURCE_MODE:-metadata}
      CHAT_NATURALIZE_RESPONSES: ${CHAT_NATURALIZE_RESPONSES:-true}
      PRELOAD_CHAT: ${PRELOAD_CHAT:-true}
      HF_HOME: /app/.cache/huggingface

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

    volumes:
      - huggingface-cache:/app/.cache/huggingface

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-test-chatbot
      dockerfile: Dockerfile

    container_name: smart-cafe-frontend

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    environment:
      # The browser calls the frontend origin. Vite proxies /api to FastAPI.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_DEV_BACKEND_URL: ${VITE_DEV_BACKEND_URL:-http://ai-service:8000}
      VITE_CHAT_ENDPOINT: ${VITE_CHAT_ENDPOINT:-/chat}
      VITE_REQUEST_TIMEOUT_MS: ${VITE_REQUEST_TIMEOUT_MS:-45000}

    depends_on:
      ai-service:
        condition: service_started

    restart: unless-stopped

volumes:
  huggingface-cache:
